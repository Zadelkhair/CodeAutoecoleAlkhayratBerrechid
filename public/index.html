<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series and Questions Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar Toggle Button -->
    <button id="sidebarToggle" class="btn btn-primary d-md-none position-fixed"
        style="top: 10px; left: 10px; z-index: 1050;">
        ☰
    </button>

    <div class="container-fluid vh-100">
        <div class="row h-100">

            <!-- Sidebar -->
            <div id="sidebar" class="pt-5 pt-md-0 col-md-3 bg-light sidebar p-3 vh-100 overflow-scroll">
                <div class="mb-3">
                    <label for="serieSelect" class="form-label">Select or Add Series</label>
                    <select class="form-select" id="serieSelect">
                        <option selected>Select series</option>
                        <!-- Add more series options dynamically -->
                    </select>
                </div>
                <div class="mb-3">
                    <label for="serieDescription" class="form-label">Series Description</label>
                    <textarea type="text" class="form-control" id="serieDescription"
                        placeholder="Enter series description"></textarea>
                </div>

                <!-- Bulk Add Questions Section -->
                <div class="mb-3">
                    <label class="form-label">Bulk Add Questions (Drop Images Below)</label>
                    <div id="bulk-image-drop"
                        style="border:2px dashed #aaa; border-radius:8px; min-height:100px; display:flex; align-items:center; justify-content:center; background:#f8f9fa; margin-bottom:10px; cursor:pointer;">
                        <span id="bulk-image-drop-text">Drop images here or click to select</span>
                        <input type="file" id="bulk-image-input" class="d-none" multiple accept="image/*">
                    </div>
                    <div id="bulk-image-preview" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
                    </div>
                    <button id="bulk-image-submit" class="btn text-white bg-black w-100" disabled>Submit Bulk
                        Images</button>
                </div>

                <h5>Questions</h5>
                <ul class="list-group list-questions" id="questionList">
                </ul>

                <div class="row">
                    <div class="col-6">
                        <button id="addQuestion" class="btn w-100 btn-primary mt-5" onclick="services.syncToDocs()">
                            sync
                        </button>
                    </div>
                    <!-- push -->
                    <div class="col-6">
                        <button id="addQuestion" class="btn w-100 btn-success mt-5" onclick="services.pushToGithub()">
                            push
                        </button>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9 p-4 vh-100 overflow-scroll">

                <!-- question-loader -->
                <div id="question-loader" class="d-none question-loader text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- select serie / question -->
                <div class="mb-3 serie-info mt-5 mt-md-0">
                    <span for="serieSelect">Selected Serie</span>
                    <span id="selectedSerie-num" class="mx-1">--</span>
                    <button class="btn btn-sm s-btn btn-danger" onclick="deleteSerie()">x</button>
                    <span class="mx-2">|</span>
                    <span for="serieSelect">Selected Question</span>
                    <span id="selectedQuestion-num" class="mx-1">--</span>
                    <button class="btn btn-sm s-btn btn-danger" onclick="deleteQuestion()">x</button>
                </div>

                <hr />

                <div class="mb-3">
                    <div
                        style="position: relative; display: flex; align-items: center; justify-content: space-between;">
                        <button id="prev-question-btn" class="prev-question-btn btn btn-outline-secondary me-2"
                            onclick="prevQ()">
                            &lt;
                        </button>
                        <div class="s-image-container" dropzone="true" id="s-image-container"
                            style="position:relative; min-height:120px; cursor:pointer; border:2px dashed #aaa; border-radius:8px;">
                            <img src="" id="s-image" style="max-width: 100%; max-height: 100%; display: block;">
                            <input type="file" id="imageFile" class="d-none">
                            <button id="remove-image-btn" type="button" class="btn btn-sm btn-danger"
                                style="position:absolute; top:5px; right:5px; z-index:2;">Remove</button>
                            <button id="generate-image-btn" type="button" class="btn btn-sm btn-warning"
                                style="position:absolute; top:5px; right:100px; z-index:2;">Generate Image</button>
                        </div>
                        <button id="next-question-btn" class="next-question-btn btn btn-outline-secondary ms-2"
                            onclick="nextQ()">
                            &gt;
                        </button>
                    </div>
                </div>

                <div class="mb-3 d-flex align-items-center justify-content-center flex-column">
                    <label class="form-label w-100 text-center">Select Correct Answer(s)</label>
                    <div class="d-flex align-items-center" id="answer-checks">
                        <div class="form-check ms-4">
                            <input class="form-check-input" type="checkbox" value="1" id="answer1">
                            <label class="form-check-label" for="answer1">1</label>
                        </div>
                        <div class="form-check ms-4">
                            <input class="form-check-input" type="checkbox" value="2" id="answer2">
                            <label class="form-check-label" for="answer2">2</label>
                        </div>
                        <div class="form-check ms-4">
                            <input class="form-check-input" type="checkbox" value="3" id="answer3">
                            <label class="form-check-label" for="answer3">3</label>
                        </div>
                        <div class="form-check ms-4">
                            <input class="form-check-input" type="checkbox" value="4" id="answer4">
                            <label class="form-check-label" for="answer4">4</label>
                        </div>
                    </div>

                </div>

                <hr />

                <div class="row">
                    <div class="col-12 col-md-6">
                        <div class="mb-3">
                            <label for="questionAudio" class="form-label">Question</label>
                            <div id="s-audio" class="s-audio-container d-flex">
                                <audio id="question-audio-player" controls class="w-100"></audio>
                                <button id="record-question-audio" class="record-button btn btn-success"></button>
                                <!-- upload button -->
                                <input type="file" id="audioFile1" class="d-none">
                                <!-- <button id="upload-question-audio" class="btn btn-sm btn-secondary">Upload</button> -->
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="mb-3">
                            <label for="audioExplanation" class="form-label">Explanation</label>
                            <div id="s-audio-explanation" class="s-audio-container d-flex">
                                <audio id="explanation-audio-player" controls class="w-100"></audio>
                                <button id="record-explanation-audio" class="record-button btn btn-success"></button>
                                <!-- upload button -->
                                <input type="file" id="audioFile2" class="d-none">
                                <!-- <button id="upload-explanation-audio" class="btn btn-sm btn-secondary">Upload</button> -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- save button -->
                <button id="saveQuestion" class="btn btn-success mt-5">
                    <div class="spinner-border spinner-border-sm text-light" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    Save Question
                </button>

            </div>
        </div>
    </div>


    <!-- Question Image Generator Modal -->
    <div class="modal fade" dir="rtl" id="qImageGenModal" tabindex="-1" aria-labelledby="qImageGenModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="qImageGenModalLabel">توليد صورة السؤال</h5>
                    <button type="button" class="btn-close me-auto ms-0" data-bs-dismiss="modal"
                        aria-label="إغلاق"></button>
                </div>
                <div class="modal-body">
                    <form id="qImageGenForm">
                        <div class="mb-3">
                            <label for="qImageInput" class="form-label">اختر صورة</label>
                            <input type="file" class="form-control" id="qImageInput" accept="image/*">
                            <img id="qImagePreview" src=""
                                style="max-width:100%;max-height:200px;display:none;margin-top:10px;">
                        </div>
                        <div class="mb-3">
                            <label for="qText" class="form-label">نص السؤال</label>
                            <textarea class="form-control" id="qText" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="qFormat" class="form-label">تنسيق السؤال</label>
                            <select class="form-select" id="qFormat">
                                <option value="format-1" selected>تنسيق 1 (اختياران)</option>
                                <option value="format-2">تنسيق 2 (ثلاثة اختيارات)</option>
                                <option value="format-3">تنسيق 3 (أربعة اختيارات)</option>
                                <option value="format-4" selected>تنسيق 4 (أربعة اختيارات مع سؤالين)</option>
                                <option value="format-5">تنسيق 5 (أربعة اختيارات مع سؤال واحد للأول)</option>
                                <option value="format-6">تنسيق 6 (أربعة اختيارات مع سؤال واحد للثاني)</option>
                                <option value="format-7">تنسيق 7 (ثلاثة اختيارات مع سؤال واحد للأول)</option>
                                <option value="format-8">تنسيق 8 (ثلاثة اختيارات مع سؤال واحد للثاني)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الاختيارات</label>
                            <div class="row">
                                <div class="col-12 mb-2"><input type="text" class="form-control"
                                        id="qQuestionChoice1and2" placeholder="السؤال 1"></div>
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="qChoice1"
                                        placeholder="اختيار 1"></div>
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="qChoice2"
                                        placeholder="اختيار 2"></div>
                                <div class="col-12 mb-2"><input type="text" class="form-control"
                                        id="qQuestionChoice3and4" placeholder="السؤال 2"></div>
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="qChoice3"
                                        placeholder="اختيار 3"></div>
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="qChoice4"
                                        placeholder="اختيار 4"></div>
                            </div>
                        </div>
                    </form>
                    <div id="qImageGenResult" style="margin-top:20px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="qImageGenBtn" class="btn btn-primary">توليد الصورة</button>
                    <button type="button" id="qImageGenSelectBtn" class="btn btn-success" style="display:none;">اختيار
                        الصورة وإغلاق</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add a button to open the modal somewhere in your UI -->
    <button class="btn btn-warning mt-3" data-bs-toggle="modal" data-bs-target="#qImageGenModal">
        Generate Question Image
    </button>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="services.js"></script>
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="image_q_generator.js"></script>
    <script>
        // Sidebar toggle functionality
        document.getElementById('sidebarToggle').addEventListener('click', function () {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.style.transform === 'translateX(0px)') {
                sidebar.style.transform = 'translateX(-100%)';
            } else {
                sidebar.style.transform = 'translateX(0px)';
            }
        });
    </script>
</body>

</html>
