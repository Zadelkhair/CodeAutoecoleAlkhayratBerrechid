<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Correction · Code Alkhayrat</title>
    <link rel="stylesheet" href="./test-classic.css" />
    <link rel="stylesheet" href="./result-classic.css" />
    <script src="./db.js"></script>
  </head>
  <body class="result-page">
    <main class="app">
      <section class="test-container" aria-label="Correction du test">
        <p id="mistake-count" class="sr-only"></p>
        <nav
          id="user-wrong-answers"
          class="user-wrong-answers"
          aria-label="Questions à revoir"
        ></nav>
        <header class="test-header">
          <div class="test-header-content">
            <a id="home-btn" href="./index.html">MENU</a>
            <div class="test-info">
              <span class="info-group">série numéro <b id="serie-num">--</b></span>
              <span class="info-divider" aria-hidden="true">-</span>
              <span class="info-group">question <b id="qustion-num">--</b></span>
              <span class="info-divider" aria-hidden="true">-</span>
              <span class="info-group">résultat <b id="result">--/--</b></span>
            </div>
          </div>
        </header>
        <div class="test-body">
          <div class="test-media">
            <img id="result-media" alt="Image de la question à revoir" />
          </div>
          <div class="test-controls">
            <div class="result-answer-display" id="answer-display1" aria-label="Votre réponse"></div>
            <div class="result-answer-display correct" id="answer-display2" aria-label="Bonne réponse"></div>
            <div class="grid-controls">
              <button class="btn-correction" type="button" onclick="prev()" id="review-prev">précédent</button>
              <button class="btn-valider" type="button" onclick="next()" id="review-next">suivant</button>
            </div>
            <button class="btn-explication" type="button" id="btn-explication" style="display: none" onclick="explication()">explication</button>
          </div>
        </div>
      </section>
    </main>
    <section class="comments-panel" aria-label="Commentaires" dir="rtl">
      <div id="comment-section"></div>
    </section>
    <script src="./result.js"></script>
  </body>
</html>
